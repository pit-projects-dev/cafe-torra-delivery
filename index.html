<!-- Seção de Avaliação da Experiência (US11) -->
    <section class="container-avaliacao">
        <h2>Avalie sua Experiência com o Café</h2>
        <div class="form-avaliacao">
            <p>O café chegou quente e no ponto ideal?</p>
            <div class="estrelas" id="grupo-estrelas">
                <i class="fa-solid fa-star" data-valor="1" onclick="selecionarEstrela(1)"></i>
                <i class="fa-solid fa-star" data-valor="2" onclick="selecionarEstrela(2)"></i>
                <i class="fa-solid fa-star" data-valor="3" onclick="selecionarEstrela(3)"></i>
                <i class="fa-solid fa-star" data-valor="4" onclick="selecionarEstrela(4)"></i>
                <i class="fa-solid fa-star" data-valor="5" onclick="selecionarEstrela(5)"></i>
            </div>
            <select id="temperatura-aval">
                <option value="Quente e Perfeito">Quente e Perfeito</option>
                <option value="Morno">Morno</option>
                <option value="Frio">Frio</option>
            </select>
            <textarea id="comentario-aval" placeholder="Escreva seu comentário sobre o sabor, aroma ou atendimento..."></textarea>
            <button class="btn-enviar-aval" onclick="enviarAvaliacao()">Enviar Avaliação</button>
        </div>
    </section>
